<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GeoScan — Teste</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: #1a73e8; color: #fff; padding: 10px 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .topbar-url { background: rgba(255,255,255,.2); border-radius: 10px; padding: 2px 10px; font-size: 11px; font-weight: 400; }
  .topbar-session { margin-left: auto; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 8px; }
  #map { flex: 1; min-height: 0; }
  .bottom { background: #fff; border-top: 1px solid #e0e0e0; padding: 12px 14px; flex-shrink: 0; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: #e6f4ea; color: #137333; }
  .pill.warn { background: #fef7e0; color: #b06000; }
  .pill.err { background: #fce8e6; color: #c5221f; }
  .pill.info { background: #e8f0fe; color: #1a73e8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cell { background: #f8f9fa; border-radius: 6px; padding: 8px 10px; }
  .cell-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .5px; }
  .cell-val { font-size: 13px; font-weight: 700; color: #333; font-family: monospace; }
  .alert-strip { background: #fce8e6; border-left: 4px solid #d93025; padding: 10px 14px; font-size: 13px; font-weight: 600; color: #c5221f; display: none; flex-shrink: 0; }
  .alert-strip.on { display: block; }

  /* Overlay */
  #overlay { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; z-index: 9999; }
  #overlay h2 { font-size: 22px; color: #1a73e8; margin-bottom: 12px; }
  #overlay p { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 16px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e8f0fe; border-top-color: #1a73e8; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { background: #1a73e8; color: #fff; border: none; border-radius: 8px; padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; max-width: 300px; margin-top: 8px; }
  .btn:active { background: #1557b0; }
  .err-box { background: #fce8e6; border-radius: 8px; padding: 16px; color: #c5221f; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
</style>
</head>
<body>

<div id="overlay">
  <div class="spinner" id="spinner"></div>
  <h2>GeoScan · Teste</h2>
  <p id="overlay-msg">Iniciando...</p>
</div>

<div class="topbar">
  <span>GeoScan</span>
  <span class="topbar-url">geoscan.app/rota</span>
  <span class="topbar-session" id="session-badge">—</span>
</div>

<div class="alert-strip" id="alert-strip">⚠ Você saiu da rota! Retorne imediatamente.</div>

<div id="map"></div>

<div class="bottom">
  <div class="pills">
    <span class="pill info" id="pill-gps">⏳ GPS</span>
    <span class="pill info" id="pill-server">⏳ Servidor</span>
    <span class="pill ok" id="pill-aba">✓ Aba ativa</span>
  </div>
  <div class="grid">
    <div class="cell"><div class="cell-label">Precisão</div><div class="cell-val" id="v-prec">—</div></div>
    <div class="cell"><div class="cell-label">Pontos enviados</div><div class="cell-val" id="v-pts">0</div></div>
    <div class="cell"><div class="cell-label">Velocidade</div><div class="cell-val" id="v-vel">—</div></div>
    <div class="cell"><div class="cell-label">Intervalo</div><div class="cell-val" id="v-int">—</div></div>
  </div>
</div>

<!-- Firebase carregado no final do body para garantir que está disponível -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Estado global
let db, sessionRef, map, marker, trail;
let trailPts = [], pontosEnviados = 0, ultimoEnvio = null;

// Lê parâmetros da URL
const p = new URLSearchParams(window.location.search);
const SID = p.get('session');
const DBURL = p.get('db');
const AKEY = p.get('key');

function setMsg(msg) { document.getElementById('overlay-msg').innerHTML = msg; }
function hideSpinner() { document.getElementById('spinner').style.display = 'none'; }

function mostrarErro(msg) {
  hideSpinner();
  document.getElementById('overlay').innerHTML =
    '<h2>GeoScan · Teste</h2><div class="err-box">' + msg + '</div>';
}

function mostrarBotao(msg, fn) {
  hideSpinner();
  document.getElementById('overlay').innerHTML =
    '<div style="font-size:48px;margin-bottom:12px">📍</div>' +
    '<h2>GeoScan · Teste</h2>' +
    '<p>' + msg + '</p>' +
    '<button class="btn" onclick="' + fn + '()">Iniciar rastreamento</button>';
}

// Inicia após DOM + scripts carregados
window.addEventListener('load', function() {
  if (!SID || !DBURL || !AKEY) {
    mostrarErro('❌ Link inválido.<br>Abra o Painel no computador e escaneie o QR Code.');
    return;
  }

  document.getElementById('session-badge').textContent = SID;

  if (typeof firebase === 'undefined') {
    mostrarErro('❌ Scripts bloqueados pelo navegador.<br><br>Abra este link no <strong>Chrome</strong>.');
    return;
  }

  setMsg('Conectando ao Firebase...');

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp({ apiKey: AKEY, databaseURL: DBURL });
    }
    db = firebase.database();
    sessionRef = db.ref('sessoes/' + SID);

    sessionRef.once('value').then(function(snap) {
      if (!snap.val()) {
        mostrarErro('❌ Sessão <strong>' + SID + '</strong> não encontrada.<br><br>Verifique se o Painel está aberto e a sessão foi criada.');
        return;
      }
      sessionRef.update({ celular_conectado: true });
      setPill('pill-server', 'ok', '✓ Firebase');
      mostrarBotao('Toque para ativar o GPS e iniciar o rastreamento de teste.<br><small style="color:#999">Sessão: ' + SID + '</small>', 'ativarGPS');
    }).catch(function(e) {
      mostrarErro('❌ Erro ao acessar sessão: ' + e.message);
    });

  } catch(e) {
    mostrarErro('❌ Erro Firebase: ' + e.message);
  }
});

// GPS
window.ativarGPS = function() {
  document.getElementById('overlay').innerHTML =
    '<div class="spinner"></div><h2>GeoScan · Teste</h2><p>Obtendo localização GPS...</p>';

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      document.getElementById('overlay').style.display = 'none';
      const ll = [pos.coords.latitude, pos.coords.longitude];
      initMap(ll);
      setPill('pill-gps', 'ok', '✓ GPS ativo');

      navigator.geolocation.watchPosition(onPos, onErrGPS, {
        enableHighAccuracy: true, timeout: 15000, maximumAge: 0
      });
    },
    function(err) {
      mostrarErro('❌ Permissão de GPS negada.<br><br>' + msgGPS(err.code) + '<br><br>Verifique as permissões do navegador e tente novamente.');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

function onPos(pos) {
  const agora = Date.now();
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const acc = pos.coords.accuracy;
  const spd = pos.coords.speed;

  let intervalo = '—';
  if (ultimoEnvio) intervalo = ((agora - ultimoEnvio) / 1000).toFixed(1) + 's';
  ultimoEnvio = agora;

  pontosEnviados++;
  document.getElementById('v-pts').textContent = pontosEnviados;
  document.getElementById('v-prec').textContent = acc ? Math.round(acc) + 'm' : '—';
  document.getElementById('v-vel').textContent = spd ? (spd * 3.6).toFixed(1) + ' km/h' : '0 km/h';
  document.getElementById('v-int').textContent = intervalo;

  sessionRef.update({
    posicao: { lat: lat, lng: lng, accuracy: acc, speed: spd, timestamp: agora, pontos: pontosEnviados },
    aba_ativa: true
  });

  const ll = [lat, lng];
  trailPts.push(ll);
  if (trail) map.removeLayer(trail);
  trail = L.polyline(trailPts, { color: '#1a73e8', weight: 5, opacity: .9 }).addTo(map);

  const icon = L.divIcon({
    html: '<div style="width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 2px 8px rgba(26,115,232,.5)"></div>',
    iconSize: [18, 18], iconAnchor: [9, 9], className: ''
  });
  if (marker) map.removeLayer(marker);
  marker = L.marker(ll, { icon: icon }).addTo(map);
  map.panTo(ll);

  setPill('pill-gps', 'ok', '✓ GPS');
  setPill('pill-server', 'ok', '✓ Enviando #' + pontosEnviados);
}

function onErrGPS(err) {
  setPill('pill-gps', 'err', '✗ GPS: ' + msgGPS(err.code));
  if (sessionRef) sessionRef.update({ erro_gps: msgGPS(err.code) });
}

function msgGPS(code) {
  return { 1: 'Permissão negada', 2: 'Sinal indisponível', 3: 'Timeout — sinal fraco' }[code] || 'Erro desconhecido';
}

// Visibilidade da aba
document.addEventListener('visibilitychange', function() {
  const ativa = !document.hidden;
  if (sessionRef) sessionRef.update({ aba_ativa: ativa });
  if (ativa) {
    setPill('pill-aba', 'ok', '✓ Aba ativa');
    document.getElementById('alert-strip').classList.remove('on');
  } else {
    setPill('pill-aba', 'warn', '⚠ Em background');
    document.getElementById('alert-strip').classList.add('on');
  }
});

function initMap(center) {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(center, 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function setPill(id, tipo, txt) {
  const el = document.getElementById(id);
  el.className = 'pill ' + tipo;
  el.textContent = txt;
}
</script>
</body>
</html>
